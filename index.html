
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNION Network | Admin Root</title>
    <style>
        /* CORE STYLES */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Courier New', Courier, monospace;
            /* THE COOL BACKGROUND */
            background: radial-gradient(circle at center, #2a0505 0%, #000000 100%) !important;
            background-attachment: fixed;
            color: #ff4d4d;
            min-height: 100vh;
            display: flex;
            overflow-x: hidden;
        }

        /* BOOT SCREEN */
        #bootScreen {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            color: #ff4d4d;
        }

        .container {
            width: 100%;
            padding: 20px;
            text-align: center;
        }

        .header-glow {
            font-size: 3rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            text-shadow: 0 0 20px rgba(255, 0, 0, 0.7);
            margin-bottom: 20px;
        }

        .main-content {
            margin-top: 50px;
            border: 1px solid rgba(255, 77, 77, 0.3);
            padding: 40px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 10px;
            display: inline-block;
        }

        button {
            background: transparent;
            color: #ff4d4d;
            border: 1px solid #ff4d4d;
            padding: 10px 20px;
            cursor: pointer;
            font-family: inherit;
            transition: 0.3s;
            margin-top: 20px;
        }

        button:hover {
            background: #ff4d4d;
            color: black;
            box-shadow: 0 0 15px #ff4d4d;
        }
    </style>
</head>
<body>

    <div id="bootScreen">
        <h1>INITIALIZING UNION NETWORK...</h1>
        <p id="status">Accessing Admin Root...</p>
    </div>

    <div class="container">
        <h1 class="header-glow">WELCOME ALL UNION UNITED</h1>
        <p>CYBER TERMINAL NETWORK</p>

        <div class="main-content">
            <h3>WELCOME</h3>
            <p>Explore games, chat, and access admin tools.</p>
            <button onclick="alert('Access Granted')">Enter Terminal</button>
        </div>
    </div>

    <script>
        // Simple script to hide boot screen
        setTimeout(() => {
            document.getElementById('bootScreen').style.display = 'none';
        }, 2500);
    </script>
</body>
</html>
