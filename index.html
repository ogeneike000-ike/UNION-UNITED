<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>UNION Network | UNION HUB</title>
    <style>
    /* Fixed Styling */
    *{box-sizing:border-box;margin:0;padding:0}
    body{
        font-family:system-ui, -apple-system, sans-serif;
        background: radial-gradient(circle at center, #1a0505 0%, #000000 100%) !important;
        color:#f5f5f5;
        min-height:100vh;
        display:flex;
    }
    a{text-decoration:none;color:inherit}
    .layout{display:flex;width:100%;min-height:100vh}

    /* Boot Screen */
    #bootScreen{
      position:fixed;inset:0;
      background: radial-gradient(circle at center, #1a0505 0%, #000000 100%) !important;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      z-index:9998;
      font-family:monospace;
      color:#ffdfdf;
    }
    #bootScreen h1{
      font-size:26px;
      letter-spacing:8px;
      color:#ff3b3b;
      text-shadow:0 0 18px #ff3b3b;
      margin-bottom:10px;
    }
    #bootLog{
      font-size:12px;
      color:#b37a7a;
      max-width:420px;
      text-align:left;
      white-space:pre-line;
    }
    #bootBar{
      margin-top:10px;
      width:220px;
      height:4px;
      border-radius:999px;
      background:#12080a;
      overflow:hidden;
    }
    #bootBarFill{
      width:0%;
      height:100%;
      background:linear-gradient(90deg,#ff3b3b,#ff7b4b);
      box-shadow:0 0 10px #ff3b3b;
      transition:width .3s;
    }

    /* Sidebar */
    .sidebar{
      width:210px;
      background:linear-gradient(180deg,#08080b,#050507);
      border-right:1px solid #2a1012;
      padding:20px 16px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
    }
    .side-logo{
      font-size:22px;
      letter-spacing:4px;
      color:#ff3b3b;
      text-shadow:0 0 12px #ff3b3b;
      margin-bottom:24px;
      animation:terminalGlow 2s infinite ease-in-out;
    }
    .nav-section h4{
      font-size:11px;
      color:#aa6666;
      margin-bottom:6px;
      text-transform:uppercase;
      letter-spacing:1px;
    }
    .nav-link{
      display:flex;
      align-items:center;
      gap:8px;
      padding:8px 6px;
      border-radius:6px;
      font-size:13px;
      color:#f0dede;
      cursor:pointer;
      margin-bottom:4px;
      transition:background .15s,box-shadow .15s;
    }
    .nav-link span.icon{
      width:16px;height:16px;border-radius:3px;background:#3a1518;
      transition:transform .25s ease,box-shadow .25s ease,background .25s ease;
    }
    .nav-link:hover span.icon{
      transform:scale(1.25) rotate(12deg);
      background:#ff3b3b;
      box-shadow:0 0 10px #ff3b3b;
    }
    .nav-link.active,
    .nav-link:hover{
      background:rgba(255,59,59,.12);
      box-shadow:0 0 10px rgba(255,59,59,.4);
    }
    .side-footer{font-size:11px;color:#7a5555}
    .side-footer p{margin:2px 0}
    .online-box{
      margin-top:8px;
      padding:6px 8px;
      border-radius:6px;
      background:#12080a;
      border:1px solid #3a1518;
      font-size:11px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }
    .online-dot{
      width:8px;height:8px;border-radius:50%;background:#3bff6b;box-shadow:0 0 8px #3bff6b;
    }

    /* Main */
    .main{
      flex:1;
      padding:20px 24px;
      display:flex;
      flex-direction:column;
    }
    #bannerContainer{margin-bottom:8px}
    #globalBanner{
      background:#ff3b3b;
      color:#050507;
      text-align:center;
      padding:8px;
      font-size:13px;
      font-weight:600;
      box-shadow:0 0 14px #ff3b3b;
      border-radius:4px;
      margin-bottom:6px;
    }
    #maintBanner{
      background:#7a1b1b;
      color:#ffeaea;
      text-align:center;
      padding:6px;
      font-size:12px;
      font-weight:600;
      box-shadow:0 0 10px #7a1b1b;
      border-radius:4px;
      margin-bottom:6px;
    }

    .top-header{text-align:center;margin-bottom:18px}
    .top-header h1{
      font-size:32px;
      letter-spacing:10px;
      color:#ff3b3b;
      text-shadow:0 0 18px #ff3b3b;
      margin-bottom:4px;
    }
    .top-header p{
      font-size:12px;
      color:#b37a7a;
      text-transform:uppercase;
      letter-spacing:2px;
    }
    .typing{
      border-right:2px solid #ff3b3b;
      white-space:nowrap;
      overflow:hidden;
    }

    .content-row{
      display:flex;
      gap:18px;
      flex:1;
      min-height:0;
    }
    .main-panel{flex:3;display:flex;flex-direction:column}
    .right-panel{flex:1.2;display:flex;flex-direction:column;gap:12px}

    /* Cards */
    .card{
      background:radial-gradient(circle at top,#1a0a0c,#050507);
      border-radius:10px;
      border:1px solid #3a1518;
      padding:12px;
      box-shadow:0 0 18px rgba(0,0,0,.8);
      animation:flicker 3s infinite;
      margin-bottom: 10px;
    }

      color:#ffb3b3;
